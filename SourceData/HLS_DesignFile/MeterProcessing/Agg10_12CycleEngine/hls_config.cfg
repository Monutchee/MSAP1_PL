part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=monutchee
package.ip.library=msap1
package.ip.name=hls_agg10_12_cycle_engine
package.ip.version=1.0
package.ip.display_name=MSAP1 10/12-cycle basic measurement engine
clock=10ns
# Same post-route margin policy as the single-cycle engine (the M7 build
# closed at -0.858 ns there): 30% uncertainty makes csynth pipeline the
# wide merge adders and finalize arithmetic instead of chaining them
# combinationally. Latency is irrelevant at one beat per grid cycle.
clock_uncertainty=30%
# The HLS timing model still estimates a 64x64 DSP-cascade multiply at
# ~7 ns single-stage; routed reality measured 10.5 ns. Force pipelined
# multipliers outright — cycle latency is free at this engine's cadence.
syn.op=mul latency=4
syn.top=hls_agg10_12_cycle_engine
syn.file=src/agg10_12_cycle_engine.cpp
syn.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
# aresetn must re-zero the block state and committed configuration
# exactly like the sibling engines.
syn.rtl.reset=state
tb.file=test/agg10_12_cycle_engine_tb.cpp
tb.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
