part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=monutchee
package.ip.library=msap1
package.ip.name=hls_agg10_12_cycle_engine
package.ip.version=1.0
package.ip.display_name=MSAP1 10/12-cycle basic measurement engine
clock=10ns
# Same post-route margin policy as the single-cycle engine (the M7 build
# closed at -0.858 ns there): 30% uncertainty makes csynth pipeline the
# wide merge adders and finalize arithmetic instead of chaining them
# combinationally. Latency is irrelevant at one beat per grid cycle.
clock_uncertainty=30%
# The HLS timing model still estimates a 64x64 DSP-cascade multiply at
# ~7 ns single-stage; routed reality measured 10.5 ns. Force pipelined
# multipliers outright — cycle latency is free at this engine's cadence.
syn.op=mul latency=4
syn.top=hls_agg10_12_cycle_engine
syn.file=src/agg10_12_cycle_engine.cpp
syn.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
# aresetn must re-zero the block state and committed configuration
# exactly like the sibling engines.
syn.rtl.reset=state

# ---------------------------------------------------------------------------
# Resource sharing (area pass, 2026-08-20). Without an allocation limit Vitis
# HLS instantiates a SEPARATE copy of every INLINE-off leaf per call site, so
# the finalize carried three atan2 CORDICs, three phasor-RMS roots, three
# power-factor dividers and two phasor-mean dividers -- ~15.4k LUT of pure
# duplication per aggregation engine (M11 measurement: the design reached
# 92% LUT at synthesis with 0.314 ns of routed margin inherited from M11).
#
# Sharing costs LATENCY, which is free here: this engine finalizes in ~6.7k
# cycles and runs 5x/s, a 0.03% duty cycle against a 20-million-cycle budget.
# It costs nothing in ARITHMETIC -- the schedule changes, the math does not --
# so the exact-golden csim/cosim bench is the acceptance test: results must
# stay bit-identical.
#
# Location = the engine top, because met_finalize_interval is INLINE'd into
# it and every call site below lives in that scope after inlining.
syn.directive.allocation=hls_agg10_12_cycle_engine met_phasor_rms_q16 limit=1 type=function
syn.directive.allocation=hls_agg10_12_cycle_engine met_atan2_turns limit=1 type=function
syn.directive.allocation=hls_agg10_12_cycle_engine met_power_factor_e6 limit=1 type=function
syn.directive.allocation=hls_agg10_12_cycle_engine met_phasor_counts limit=1 type=function
syn.directive.allocation=hls_agg10_12_cycle_engine met_turns_to_millidegrees limit=1 type=function
# met_rotate_a/a2 are called twice each from INSIDE met_sequence_components,
# which is INLINE off -- a hard module boundary, so the limit belongs there
# and not at the engine top.
syn.directive.allocation=met_sequence_components met_rotate_a limit=1 type=function
syn.directive.allocation=met_sequence_components met_rotate_a2 limit=1 type=function
#
# NOT shared: met_rms_from_accumulators<128,128> also has two copies, but one
# lives inside met_finalize_lane (INLINE off, instantiated once and looped
# over 7 lanes) and the other in the met_fin_pairs loop. Sharing across that
# module boundary needs the lane/pair finalize restructured, not a pragma;
# ~3.2k LUT per engine left on the table for the shared-finalize pass.
tb.file=test/agg10_12_cycle_engine_tb.cpp
tb.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
