part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=monutchee
package.ip.library=msap1
package.ip.name=hls_aggregation_engine
package.ip.version=1.0
package.ip.display_name=MSAP1 cycle-block aggregation engine
clock=10ns
# Inherited from both engines this replaces: 30% uncertainty makes csynth
# pipeline the wide merge adders and finalize arithmetic instead of
# chaining them combinationally. Latency is irrelevant at one input beat
# per grid cycle.
clock_uncertainty=30%
# The HLS timing model still estimates a 64x64 DSP-cascade multiply at
# ~7 ns single-stage; routed reality measured 10.5 ns. Force pipelined
# multipliers outright.
syn.op=mul latency=4
syn.top=hls_aggregation_engine
syn.file=src/aggregation_engine.cpp
# Diagnostic synthesis switch.  Production keeps the non-normative live
# 10-minute and 2-hour previews enabled.  Set this macro to 0 in both cflags
# lines only for a paired utilization experiment; completed records remain
# byte-identical and are checked by the C test bench.
syn.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192 -DMNC_AGGREGATION_ENABLE_OPEN_PREVIEWS=1
# aresetn must re-zero every tier's state and committed configuration.
syn.rtl.reset=state
tb.file=test/aggregation_engine_tb.cpp
tb.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192 -DMNC_AGGREGATION_ENABLE_OPEN_PREVIEWS=1

# ---------------------------------------------------------------------------
# Resource sharing (A1). The finalize has ONE call site by construction (the
# two-pass loop in the engine), so it is one instance whatever the inliner
# does. These limits cover the leaves the M12 pragma pass could not reach
# from the engine top, now that both tiers' call sites live in one scope.
syn.directive.allocation=hls_aggregation_engine met_phasor_rms_q16 limit=1 type=function
syn.directive.allocation=hls_aggregation_engine met_atan2_turns limit=1 type=function
syn.directive.allocation=hls_aggregation_engine met_power_factor_e6 limit=1 type=function
syn.directive.allocation=hls_aggregation_engine met_phasor_counts limit=1 type=function
syn.directive.allocation=hls_aggregation_engine met_turns_to_millidegrees limit=1 type=function
syn.directive.allocation=hls_aggregation_engine serialize_record_format limit=1 type=function
# The three payload builders are ONE source definition inlined into both
# tiers -- see the comment on them: sharing them as modules measured
# -440 LUT for +1,565 FF and was reverted.
# Both a and a-squared rotations now use the same direction-selectable leaf,
# allowing one constant-multiplier datapath to serve all four rotations.
syn.directive.allocation=met_sequence_components met_rotate_120 limit=1 type=function
