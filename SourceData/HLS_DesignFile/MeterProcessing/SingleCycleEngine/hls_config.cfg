part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
package.ip.vendor=monutchee
package.ip.library=msap1
package.ip.name=hls_single_cycle_engine
package.ip.version=1.0
package.ip.display_name=MSAP1 single-cycle measurement engine
clock=10ns
# Post-route timing closure (M7 build): the default uncertainty let
# csynth schedule the 64x64 squaring multiplies combinationally (27 logic
# levels through a DSP cascade, -0.858 ns WNS routed). A 30% uncertainty
# forces multi-cycle DSP pipelines; the engine's per-frame budget
# (>= ~780 clocks even at 128 kSPS) dwarfs the added latency.
clock_uncertainty=30%
# The HLS timing model still estimates a 64x64 DSP-cascade multiply at
# ~7 ns single-stage; routed reality measured 10.5 ns. Force pipelined
# multipliers outright — cycle latency is free at this engine's cadence.
syn.op=mul latency=4
syn.top=hls_single_cycle_engine
syn.file=src/single_cycle_engine.cpp
syn.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
# Window bookkeeping and the sequence counter must re-zero on aresetn
# exactly like the sibling engines.
syn.rtl.reset=state
tb.file=test/single_cycle_engine_tb.cpp
tb.cflags=-Isrc -I../../common/include -DAP_INT_MAX_W=8192
